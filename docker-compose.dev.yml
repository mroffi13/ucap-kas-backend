services:
  postgres:
    image: postgres:16-alpine
    container_name: ucapkas_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ucapkas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucapkas_local_dev_pw}
      POSTGRES_DB: ucapkas
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c max_connections=50
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucapkas -d ucapkas"]
      interval: 3s
      timeout: 3s
      retries: 10

  bifrost:
    image: maximhq/bifrost:latest
    container_name: ucapkas_bifrost_gateway
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      LOG_LEVEL: info
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-ucapkas-bifrost-setup}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8085:8080"
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ucapkas_api_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://ucapkas:${POSTGRES_PASSWORD:-ucapkas_local_dev_pw}@postgres:5432/ucapkas?sslmode=disable
      ALLOW_DEV_MOCK_AUTH: ${ALLOW_DEV_MOCK_AUTH:-true}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  pgdata_dev:
  gomodcache:
  gobuildcache:
  bifrost_data:
